name: Auto-land

# Event-driven sweeper for gated auto-land (issue #29). Scoped to THIS repo —
# a deliberate, documented exception to workspace CLAUDE.md Rule #7 (see this
# repo's CLAUDE.md "Gated auto-land" section). Governance elsewhere is unchanged.
#
# A PR auto-merges (squash + delete branch) once it is reviewed + green, with NO
# human merge step. Eligibility keys on the `auto-land` LABEL, not author
# identity — the merge is performed with AUTOLAND_PAT (a real user token), so
# downstream push/workflow_run jobs (deploy.yml) fire. GITHUB_TOKEN-performed
# merges do NOT trigger those, which is why the PAT is required.
#
# DRY-RUN by default: unless repo variable AUTOLAND_LIVE == "true", the sweeper
# logs "would land #N" and merges nothing. This lets us ship the sweeper safely
# before flipping it live (`gh variable set AUTOLAND_LIVE --body true`).
#
# Required contexts (ALL must be success in the PR's statusCheckRollup):
#   Type-check & build · Link check · review/clear
# Advisory "Lighthouse (advisory)" is NOT required; a rollup left UNSTABLE only
# by Lighthouse must still be allowed to land.

on:
  check_suite:
    types: [completed]
  pull_request_review:
    types: [submitted]
  status:
  pull_request_target:
    types: [labeled]
  schedule:
    - cron: "*/30 * * * *" # safety net in case an event is missed
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: read
  checks: read

concurrency:
  group: auto-land
  cancel-in-progress: false

jobs:
  sweep:
    name: Sweep eligible PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # gh CLI default token — used for READS (listing PRs, comments, rollup).
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Real-user PAT — used ONLY for the merge, so downstream CI/deploy fire.
      AUTOLAND_PAT: ${{ secrets.AUTOLAND_PAT }}
      AUTOLAND_LIVE: ${{ vars.AUTOLAND_LIVE }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name || github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sweep
        run: node .github/scripts/auto-land.mjs

  # Crash-heartbeat (house pattern, mirrors the actuator sweeps). The beat's own
  # fail-loud only helps if the job REACHED it. When a run dies earlier — token
  # mint, runner death, quota, `npm ci` — the missed beat would otherwise be
  # invisible: Slack narration is fail-soft, so a Slack outage swallows the signal
  # entirely and only a red run in the Actions tab remains. This lands the miss
  # somewhere durable instead. Dedupes into ONE open issue, and auto-closes it on
  # the next green run so a recovered beat doesn't leave litter.
  alert:
    needs: [sweep]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Flag failure or clear on recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # this job has no checkout, so pin the repo for gh
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          SUCCEEDED: ${{ contains(needs.*.result, 'success') }}
        run: |
          set -euo pipefail
          WF="auto-land"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING="$(gh issue list --search "\"beat failure: ${WF}\" in:title" --state open --json number --jq '.[0].number // empty')"
          if [ "${FAILED}" != "true" ]; then
            # Nothing failed. Close any open failure issue only on a run that actually
            # succeeded — an all-skipped run is not evidence of recovery.
            if [ "${SUCCEEDED}" = "true" ] && [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Recovered: ${WF} succeeded — ${RUN_URL}."
            fi
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: ${RUN_URL}"
          else
            gh issue create \
              --title "beat failure: ${WF} ($(date -u +%F))" \
              --body "The \`${WF}\` beat failed before it could report — see ${RUN_URL}"
          fi
