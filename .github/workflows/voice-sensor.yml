name: Voice sensor

# The PRODUCER half of the split voice-evolution pair (issue #56). In the
# sensors/actors paradigm (docs/architecture/sensors-and-actors.md) this SENSES
# only: it reads this week's public frontier-lab signal and, if there is signal,
# files ONE `voice-proposal` issue describing a warranted bounded VOICE.md change.
# It NEVER edits files, calls the LLM, or opens a PR — the voice ACTOR
# (voice-actor.yml) does that, consuming the issue. They share only the
# `voice-proposal` label + marker schema.
#
#   gather (scripts/voice/gather.mjs — public, robust, no secret) → sense
#   (scripts/voice/sense.mjs — emits one deduped `voice-proposal` issue).
#
# Sun 20:00 UTC — BEFORE the voice actor (Sun 21:00 UTC), which is itself before
# field-notes (Sun 22:00 UTC): a sensed proposal can be acted on the same night,
# and a landed voice nudge can inform that week's note.
#
# No GitHub token isn't possible in Actions (GITHUB_TOKEN is always present), but
# an empty signal week → sense no-ops. The `voice-proposal` label is created at
# runtime by sense.mjs (ensureLabel), so a missing label never errors (#55).

on:
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: voice-sensor
  cancel-in-progress: false

jobs:
  sense:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Slack — narrate start (thread root)
        id: slack
        continue-on-error: true
        uses: rarebit-one/.github/.github/actions/slack-deploy-thread@main
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_STATIC_V3_CHANNEL_ID }}
          mode: start
          text: "🧪 *Voice sensor started* — `${{ github.repository }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run log>"

      - name: Gather (public frontier-lab signal)
        run: node scripts/voice/gather.mjs signal.json

      - name: Sense (file a deduped voice-proposal issue, if warranted)
        run: node scripts/voice/sense.mjs signal.json

      - name: Slack — narrate outcome (thread reply)
        if: always()
        continue-on-error: true
        uses: rarebit-one/.github/.github/actions/slack-deploy-thread@main
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_STATIC_V3_CHANNEL_ID }}
          mode: reply
          thread_ts: ${{ steps.slack.outputs.thread_ts }}
          text: >-
            ${{ job.status == 'success' && '✅ voice signal sensed — check the queue' || '🔴 voice sensor failed' }}
            — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run log>

  # Crash-heartbeat (house pattern, mirrors the actuator sweeps). The beat's own
  # fail-loud only helps if the job REACHED it. When a run dies earlier — token
  # mint, runner death, quota, `npm ci` — the missed beat would otherwise be
  # invisible: Slack narration is fail-soft, so a Slack outage swallows the signal
  # entirely and only a red run in the Actions tab remains. This lands the miss
  # somewhere durable instead. Dedupes into ONE open issue, and auto-closes it on
  # the next green run so a recovered beat doesn't leave litter.
  alert:
    needs: [sense]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Flag failure or clear on recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # this job has no checkout, so pin the repo for gh
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          SUCCEEDED: ${{ contains(needs.*.result, 'success') }}
        run: |
          set -euo pipefail
          WF="voice-sensor"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING="$(gh issue list --search "\"beat failure: ${WF}\" in:title" --state open --json number --jq '.[0].number // empty')"
          if [ "${FAILED}" != "true" ]; then
            # Nothing failed. Close any open failure issue only on a run that actually
            # succeeded — an all-skipped run is not evidence of recovery.
            if [ "${SUCCEEDED}" = "true" ] && [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Recovered: ${WF} succeeded — ${RUN_URL}."
            fi
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: ${RUN_URL}"
          else
            gh issue create \
              --title "beat failure: ${WF} ($(date -u +%F))" \
              --body "The \`${WF}\` beat failed before it could report — see ${RUN_URL}"
          fi
