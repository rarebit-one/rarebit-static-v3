name: Weekly rebuild

# The hero stats, Operations receipts, and gem versions are fetched at build
# time — a weekly forced rebuild keeps them fresh between code pushes.
# Mondays 06:00 SGT (22:00 UTC Sunday).

on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Slack — narrate start (thread root)
        id: slack
        continue-on-error: true
        uses: rarebit-one/.github/.github/actions/slack-deploy-thread@main
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_STATIC_V3_CHANNEL_ID }}
          mode: start
          text: "🧪 *Weekly rebuild started* — `${{ github.repository }}`\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run log>"

      - name: Trigger DO App Platform deployment
        # App ID = rarebit-static-v3 on App Platform (see .do/app.yaml)
        # A missing DIGITALOCEAN_ACCESS_TOKEN no-ops this step (workflow stays
        # green until wired up), mirroring farm-feed/field-notes. When the token
        # IS set but the API rejects it, surface the HTTP status + body so the
        # failure is actionable instead of a bare `curl 22`.
        env:
          DO_API_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          if [ -z "${DO_API_TOKEN:-}" ]; then
            echo "::warning::DIGITALOCEAN_ACCESS_TOKEN is not set — skipping forced DO rebuild (no-op)."
            echo "Set the secret (rarebit team, write scope) to enable the weekly rebuild — see the /do-deploy-tokens skill."
            exit 0
          fi
          status=$(curl -sS -o /tmp/do-resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${DO_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"force_build": true}' \
            "https://api.digitalocean.com/v2/apps/ca13ba74-9817-4286-86e9-21eda91e05c2/deployments")
          if [ "${status}" -ge 400 ]; then
            echo "::error::DO deployments API returned HTTP ${status}"
            cat /tmp/do-resp.json
            exit 1
          fi
          echo "Forced DO rebuild triggered (HTTP ${status})."

      - name: Slack — narrate outcome (thread reply)
        if: always()
        continue-on-error: true
        uses: rarebit-one/.github/.github/actions/slack-deploy-thread@main
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_STATIC_V3_CHANNEL_ID }}
          mode: reply
          thread_ts: ${{ steps.slack.outputs.thread_ts }}
          text: >-
            ${{ job.status == 'success' && '✅ forced DO rebuild triggered' || '🔴 weekly rebuild failed' }}
            — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run log>

  # Crash-heartbeat (house pattern, mirrors the actuator sweeps). The beat's own
  # fail-loud only helps if the job REACHED it. When a run dies earlier — token
  # mint, runner death, quota, `npm ci` — the missed beat would otherwise be
  # invisible: Slack narration is fail-soft, so a Slack outage swallows the signal
  # entirely and only a red run in the Actions tab remains. This lands the miss
  # somewhere durable instead. Dedupes into ONE open issue, and auto-closes it on
  # the next green run so a recovered beat doesn't leave litter.
  alert:
    needs: [rebuild]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Flag failure or clear on recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # this job has no checkout, so pin the repo for gh
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          SUCCEEDED: ${{ contains(needs.*.result, 'success') }}
        run: |
          set -euo pipefail
          WF="weekly-rebuild"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING="$(gh issue list --search "\"beat failure: ${WF}\" in:title" --state open --json number --jq '.[0].number // empty')"
          if [ "${FAILED}" != "true" ]; then
            # Nothing failed. Close any open failure issue only on a run that actually
            # succeeded — an all-skipped run is not evidence of recovery.
            if [ "${SUCCEEDED}" = "true" ] && [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Recovered: ${WF} succeeded — ${RUN_URL}."
            fi
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: ${RUN_URL}"
          else
            gh issue create \
              --title "beat failure: ${WF} ($(date -u +%F))" \
              --body "The \`${WF}\` beat failed before it could report — see ${RUN_URL}"
          fi
