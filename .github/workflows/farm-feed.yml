name: Farm feed

# Nightly client-work replay pipeline (00:30 SGT / 16:30 UTC):
# gather (private workflow runs, deterministically anonymized) → phrase
# (one Haiku call, generic templates only) → validate (hard gate on any
# leaked identifier) → publish JSON to a DO Spaces bucket. The site replays
# yesterday's events on a 24h delay. See scripts/farm-feed/*.
#
# There is ONE feed and it is public. Objects are uploaded `--acl public-read`,
# so anything this workflow writes is world-readable the instant it lands. There
# is no unpublished holding area and no promotion step: `validate.mjs` is the
# sole pre-publication gate, and it runs before the upload. (This used to carry a
# `staging`/`live` channel split described as "staging until trusted" — it never
# isolated anything, since both prefixes were written public-read and the site
# read `staging` by default. Removed in #344.)
#
# Missing any secret → the relevant step no-ops (exit 0) and publish is
# skipped, so the workflow stays green until all four are wired up:
#   FEED_GITHUB_PAT · OPENAI_API_KEY · SPACES_KEY_ID · SPACES_SECRET

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farm-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FEED_GITHUB_PAT: ${{ secrets.FEED_GITHUB_PAT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      SPACES_KEY_ID: ${{ secrets.SPACES_KEY_ID }}
      SPACES_SECRET: ${{ secrets.SPACES_SECRET }}
      BUCKET: rarebit-farm-feed
      SPACES_ENDPOINT: https://sgp1.digitaloceanspaces.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Gather (anonymize private workflow runs)
        run: node scripts/farm-feed/gather.mjs sanitized.json

      - name: Phrase (one LLM call — generic templates)
        run: node scripts/farm-feed/phrase.mjs sanitized.json phrased.json

      - name: Validate + assemble (hard gate)
        id: validate
        run: |
          if [ ! -f phrased.json ]; then
            echo "phrased.json absent (secrets not yet wired) — skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/farm-feed/validate.mjs sanitized.json phrased.json farm-replay.json
          # validate exits 0 without writing the artifact on an empty day —
          # only publish when it actually produced one.
          if [ -f farm-replay.json ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "No artifact produced (empty window) — skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Spaces
        if: steps.validate.outputs.publish == 'true'
        run: |
          if [ -z "${SPACES_KEY_ID:-}" ] || [ -z "${SPACES_SECRET:-}" ]; then
            echo "::warning::Spaces credentials not set — skipping upload."
            exit 0
          fi
          export AWS_ACCESS_KEY_ID="$SPACES_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$SPACES_SECRET"
          WINDOW=$(node -e "process.stdout.write(require('./farm-replay.json').window)")
          # The rolling object the site reads, plus a dated archive copy. Both
          # are public-read by design — see the header.
          aws s3 cp farm-replay.json "s3://$BUCKET/farm-replay.json" \
            --endpoint-url "$SPACES_ENDPOINT" --acl public-read \
            --cache-control "max-age=300" --content-type application/json
          aws s3 cp farm-replay.json "s3://$BUCKET/archive/$WINDOW.json" \
            --endpoint-url "$SPACES_ENDPOINT" --acl public-read \
            --cache-control "max-age=31536000" --content-type application/json
          echo "Published farm-replay.json (window $WINDOW)"

  # Crash-heartbeat (house pattern, mirrors the actuator sweeps). The beat's own
  # fail-loud only helps if the job REACHED it. When a run dies earlier — token
  # mint, runner death, quota, `npm ci` — the missed beat would otherwise be
  # invisible: Slack narration is fail-soft, so a Slack outage swallows the signal
  # entirely and only a red run in the Actions tab remains. This lands the miss
  # somewhere durable instead. Dedupes into ONE open issue, and auto-closes it on
  # the next green run so a recovered beat doesn't leave litter.
  alert:
    needs: [publish]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Flag failure or clear on recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # this job has no checkout, so pin the repo for gh
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          SUCCEEDED: ${{ contains(needs.*.result, 'success') }}
        run: |
          set -euo pipefail
          WF="farm-feed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING="$(gh issue list --search "\"beat failure: ${WF}\" in:title" --state open --json number --jq '.[0].number // empty')"
          if [ "${FAILED}" != "true" ]; then
            # Nothing failed. Close any open failure issue only on a run that actually
            # succeeded — an all-skipped run is not evidence of recovery.
            if [ "${SUCCEEDED}" = "true" ] && [ -n "$EXISTING" ]; then
              gh issue close "$EXISTING" --comment "Recovered: ${WF} succeeded — ${RUN_URL}."
            fi
            exit 0
          fi
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Failed again: ${RUN_URL}"
          else
            gh issue create \
              --title "beat failure: ${WF} ($(date -u +%F))" \
              --body "The \`${WF}\` beat failed before it could report — see ${RUN_URL}"
          fi
